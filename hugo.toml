baseURL = 'https://t4everup.github.io/'
locale = 'en-us'
title = 'My New Hugo Project'
languageCode = "zh-cn"
theme = "digio"

[params]
  author = "168"
  description = "this is my blog"

  [params.social]
    github = "https://github.com/yourname"
    email = "your@email.com"
    twitter = ""
    bilibili = ""

# 站内搜索：home 额外输出 /index.json 作为搜索索引
[outputs]
  home = ["html", "rss", "json"]

[outputFormats.json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

