{{ $url := .Destination }}
<figure class="digio-lightbox">
  <a href="#lightbox-{{ .Ordinal }}" class="digio-lightbox-open">
    <img src="{{ $url }}" alt="{{ .Text }}" {{ with .Title }}title="{{ . }}"{{ end }} loading="lazy">
  </a>
  <div class="digio-lightbox-overlay" id="lightbox-{{ .Ordinal }}" role="dialog" aria-modal="true">
    <a class="digio-lightbox-close" href="#" aria-label="close">&times;</a>
    <img src="{{ $url }}" alt="{{ .Text }}">
    {{ with .Title }}<figcaption>{{ . }}</figcaption>{{ end }}
  </div>
</figure>
