{{/* 表格：包一层容器，窄屏可横向滚动而不撑破页面 */}}
<div class="table-wrap">
  <table>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th {{ with .Alignment }}style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td {{ with .Alignment }}style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
