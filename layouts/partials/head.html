<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsPage }}{{ partial "page-title.html" . }} · {{ end }}{{ .Site.Title }}</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/content.css" rel="stylesheet">
    {{ if .IsPage }}
    {{/* 数学公式（KaTeX）：只在文章页加载 */}}
    <link href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" rel="stylesheet">
    {{ end }}
    {{ with site.Home.OutputFormats.Get "rss" -}}
    <link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ $.Site.Title }}">
    {{ end }}
    <style>
        /* 图片放大浮层（配合 layouts/partials/lightbox.html） */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 2rem;
        }
        .lightbox-overlay[hidden] { display: none; }
        .lightbox-img {
            max-width: 92vw;
            max-height: 86vh;
            object-fit: contain;
            border-radius: 0.4rem;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
            cursor: default;
        }
        .lightbox-close {
            position: absolute;
            top: 0.75rem;
            right: 1rem;
            font-size: 2.5rem;
            line-height: 1;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            opacity: 0.75;
            transition: opacity 0.15s ease;
        }
        .lightbox-close:hover { opacity: 1; }
        .lightbox-caption {
            position: absolute;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            margin: 0;
            padding: 0 1rem;
        }
        /* 可放大的图片（markdown 渲染出来的图） */
        img[data-lightbox] {
            cursor: zoom-in;
        }
    </style>
</head>
